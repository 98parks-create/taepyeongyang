<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>태평양애드 - 관리자 모드</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem("isAdmin") !== "true") {
            alert("관리자만 들어갈 수 있는 페이지입니다.");
            window.location.href = "manager_login.html";
        }
    </script>
    <style>
        body { background: #f4f7f6; margin: 0; padding: 0; }
        .manager-container { padding: 100px 0; min-height: 80vh; }
        .manager-inner { width: 95%; max-width: 1200px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .m-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00083a; padding-bottom: 20px; margin-bottom: 30px; }
        .m-header h2 { color: #00083a; margin: 0; }
        .logout-btn { background: #666; color: #fff; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th { background: #00083a; color: #fff; padding: 15px; text-align: left; }
        .admin-table td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.95rem; color: #333; }
        .admin-table tr:hover { background: #f9f9f9; }
        
        .btn-view { padding: 5px 12px; background: #101155; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-view:hover { background: #2a2c8a; }
        .text-truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            padding-bottom: 20px;
        }
        .pagination button {
            padding: 8px 20px;
            background: #00083a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #page-num {
            font-weight: bold;
            font-size: 1.1rem;
            color: #00083a;
        }
    </style>
</head>
<body>

    <section class="manager-container">
        <div class="manager-inner">
            <div class="m-header">
                <h2>📊 실시간 고객 문의 내역</h2>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="search-input" placeholder="이름 검색" 
                           style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9rem; width: 150px;">
                    <button onclick="searchContact()" 
                            style="padding: 8px 15px; background: #101155; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
                        검색
                    </button>
                    <button class="logout-btn" onclick="location.href='tad_manager.html'">뒤로 가기</button>
                </div>
            </div>
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>성함</th>
                        <th>연락처</th>
                        <th>문의내용</th>
                        <th>유형</th>
                        <th>관리</th> 
                    </tr>
                </thead>
                <tbody id="contact-list">
                    <tr>
                        <td colspan="6" style="text-align:center; padding:50px;">데이터를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination">
                <button id="prev-btn" onclick="prevPage()">이전</button>
                <span id="page-num">1</span>
                <button id="next-btn" onclick="nextPage()">다음</button>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs, limit, startAfter, where, count } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAMOEWa_cTOIAAFItBbTvvKoR4E9M2RH40",
            authDomain: "tad-manager-47444.firebaseapp.com",
            projectId: "tad-manager-47444",
            storageBucket: "tad-manager-47444.firebasestorage.app",
            messagingSenderId: "77084257905",
            appId: "1:77084257905:web:20a01999b7a9299e72b5d0",
            measurementId: "G-0FSJXEN7TW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const PAGE_SIZE = 12;
let currentPage = 1;
let currentSearch = "";
let allDocs = []; 

function renderPagination(totalCount) {
    const paginationDiv = document.querySelector('.pagination');
    const totalPages = Math.ceil(totalCount / PAGE_SIZE);
    
    let html = `<button id="prev-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">이전</button>`;
    
    for (let i = 1; i <= totalPages; i++) {
        html += `<span class="page-num ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})" 
                  style="cursor:pointer; margin: 0 8px; font-weight:${i === currentPage ? 'bold' : 'normal'}; 
                  text-decoration:${i === currentPage ? 'underline' : 'none'}; color:${i === currentPage ? '#101155' : '#666'};">
                  ${i}
                </span>`;
    }
    
    html += `<button id="next-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">다음</button>`;
    paginationDiv.innerHTML = html;
}

window.goToPage = async (page) => {
    if (page < 1) return;
    currentPage = page;
    loadContacts();
};

async function loadContacts() {
    const tbody = document.getElementById('contact-list');
    tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:50px;'>데이터를 불러오는 중...</td></tr>";

    try {
        const contactsRef = collection(db, "contacts");

        let constraints = [];
        if (currentSearch) {
            constraints.push(where("name", "==", currentSearch));
        }

        const countQuery = query(contactsRef, ...constraints);
        const countSnapshot = await getDocs(countQuery);
        const totalCount = countSnapshot.size;

        const q = query(
            contactsRef, 
            ...constraints, 
            orderBy("timestamp", "desc"), 
            limit(PAGE_SIZE * currentPage) 
        );
        
        const querySnapshot = await getDocs(q);
        const docs = querySnapshot.docs.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

        if (docs.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:50px;'>내역이 없습니다.</td></tr>";
            return;
        }

        tbody.innerHTML = "";
        docs.forEach((docSnap) => {
            const data = docSnap.data();
            const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : "-";
            tbody.innerHTML += `
                <tr>
                    <td>${date}</td>
                    <td><strong>${data.name || '-'}</strong></td>
                    <td>${data.phone || '-'}</td>
                    <td class="text-truncate">${data.message || '-'}</td>
                    <td>${data.type || '일반'}</td>
                    <td><button class="btn-view" onclick="location.href='contact_detail.html?id=${docSnap.id}'">확인</button></td>
                </tr>`;
        });

        renderPagination(totalCount);

    } catch (error) {
        console.error("오류 발생:", error);
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:red;'>데이터 로드 중 오류가 발생했습니다. (인덱스 확인 필요)</td></tr>";
    }
}

window.searchContact = () => {
    currentSearch = document.getElementById('search-input').value.trim();
    currentPage = 1;
    loadContacts();
};

document.getElementById('search-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.searchContact();
});

loadContacts();
       
    </script>
</body>
</html>
