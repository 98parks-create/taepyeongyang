<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태평양애드(TAD)</title>
</head>
<style>
    .video-container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
    }

    #bg-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .nt{ font-size: 20px;}

    .remote-menu {
        position: absolute;
        top: 50%;
        right: 20px; 
        transform: translateY(-50%);
        z-index: 100; 
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .menu-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 90px;
        height: 90px;
        text-decoration: none;
        margin-bottom: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        font-size: 12px;
        transition: all 0.2s ease;
        background: rgb(0, 0, 0, 0%);
        backdrop-filter: blur(10px);
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .menu-item img {
        width: 40px;  
        height: 40px;
        margin-bottom: 5px; 
        object-fit: contain;
    }

    .menu-item span {
        font-size: 13px;
        color:#ffffff;
        font-weight: bold;
    }


    .menu-item:hover {
        transform: translateY(-5px);
        background: rgba(0, 0, 0, 0.8);
    }
    .menu-item span:hover {
        font-size: 13px;
        color: #333;
        font-weight: bold;
    }

    .menu-item.kakao:hover { background: #FEE500;}
    .menu-item.call:hover { background: #2ecc71; }
    .menu-item.chatbot:hover { background: #0B7BC7;}

    header {
        position: fixed; width: 100%; 
        display: flex; align-items: center; justify-content: center; text-align: center;
        z-index: 1000; transition: 0.3s; color: white;
    }
    header.scrolled { background: rgb(255, 255, 255); color: #00083a; border-bottom: 1px solid #eee; }

    nav { width: 100%; display: flex; justify-content: space-between; align-items: center; background-color: rgba(255, 255, 255, 0.377); padding:15px 85px 15px 0;}
    .logo { font-size: 0.7rem; font-weight: bold; letter-spacing: 2px; text-align: center; padding-left: 85px; width: 250px;}
    nav ul { display: flex; list-style: none; gap: 40px; color: #00083a; }
    nav ul li a { text-decoration: none; color: inherit; font-size: 0.95rem; }
    .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    video { width: 100%; height: 950px; object-fit: cover; filter: brightness(0.7); }

    .hero-text {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; color: white;
    }
    .hero-text h1 { font-size: 4rem; margin-bottom: 20px; font-size: 55px;}

.chatbot-window {
    display: none; 
    position: fixed; 
    bottom: 100px; 
    right: 20px;
    width: 320px;
    height: 440px;
    background: white; 
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    flex-direction: column; 
    z-index: 9999;
    overflow: hidden;
}

.chatbot-header { 
    background: #101155; 
    color: #fff; 
    padding: 15px; 
    display: flex; 
    justify-content: space-between; 
    cursor: move;
    user-select: none;
}

.chatbot-messages { 
    flex: 1; 
    padding: 15px; 
    overflow-y: auto; 
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    scrollbar-gutter: stable;
    gap: 10px; 
    background: #f9f9f9;
}

.message { padding: 8px 12px; border-radius: 10px; max-width: 100%; font-size: 15px; line-height: 1.4; white-space: pre-line; }
.user { align-self: flex-end; background: #ffe100; color: #101155; font-weight: 500; } /* 카카오 느낌의 사용자 말풍선 */
.bot { 
    align-self: flex-start; 
    background: #101155; 
    color: white; 
    position: relative;
    width: fit-content;     
    max-width: 100%;        
    overflow: hidden;       
    flex-shrink: 0;          
    word-break: break-all;   
    line-height: 23px;
}

.bot-tbx {
    width: 275px;
}

.bot::after {
    content: "";
    position: absolute;
    top: -80%;
    left: -60%;
    width: 20%;
    height: 200%;
    background: rgba(255, 255, 255, 0.2); 
    transform: rotate(30deg); 
    animation: shine 3s infinite; 
}

@keyframes shine {
    0% { left: -60%; }
    20% { left: 120%; } 
    100% { left: 120%; }
}


.chatbot-input button { 
    position: relative;
    background: transparent; 
    color: #101155; 
    padding: 7px 15px; 
    border-radius: 5px; 
    cursor: pointer; 
    font-size: 14px; 
    font-weight: 600; 
    overflow: hidden;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    /*min-width: 60px;*/
}

.chatbot-input button::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(#101155, #101155 80%, #101155 90%, #ffe100 100%);
    transform-origin: center;
    transform: translate(-50%, -50%) rotate(0deg);
    animation: rotateBorder 1.5s linear infinite;
    z-index: -2;
}
.chatbot-input button::after {
    content: "";
    position: absolute;
    inset: 2px; 
    background: white;
    border-radius: 3px;
    z-index: -1;
    transition: 0.05s;
}

.chatbot-input button:hover::after {
    background: #101155; 
}
.chatbot-input button:hover { color: #ffffff; }

@keyframes rotateBorder {
    0% { transform: rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}

.menu-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
.menu-btn { 
    font-size: 15px;
    font-weight: 500;
    border: 1px solid #101155; 
    background: white; 
    color: #101155; 
    padding: 8px; 
    border-radius: 8px; 
    cursor: pointer; 
    transition: 0.3s;
    text-align: center;
}
.menu-btn:hover { background: #101155; color: white; font-weight: 500;}

.chatbot-input { padding: 10px; display: flex; border-top: 1px solid #eee; background: white; }
.chatbot-input input { flex: 1; border: none; border-radius: 5px; outline: none; padding-left: 10px; }
</style>
<body>
    <section class="hero">
       
		<div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="2865276-uhd_3840_2160_30fps.mp4">
            </video>
         <section class="contact-form">
            <div class="hero-text">
                <h1>TAEPYEONGYANG&nbsp;AD</h1>
                <p class="nt">매 순간 진실된 마음과 태도로</p>
            </div>
        </section>
            <div class="remote-menu">
                <a href="tel:010-3515-5678" class="menu-item call">
                    <img src="call.png" alt="전화">
                    <span>전화문의</span>
                </a>
                <a href="kakao.html" target="_blank" class="menu-item kakao">
                    <img src="kakao.png" alt="카톡">
                    <span>카톡문의</span>
                </a>
                <a href="#" onclick="openChatbot()" class="menu-item chatbot">
                    <img src="chatbot.png" alt="챗봇">
                    <span>챗봇상담</span>
                </a>
            </div>

        <div id="chatbot-window" class="chatbot-window">
            <div class="chatbot-header" id="drag-handle">
                <span>태평양애드(TAD) 상담봇</span>
                <button onclick="closeChatbot()" style="cursor:pointer; background:none; border:none; color:white; font-size:16px;">✕</button>
            </div>

            <div id="chatbot-messages" class="chatbot-messages"></div>
                <div class="chatbot-input">
                <input type="text" id="user-input" placeholder="문의사항을 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">전송</button>
                </div>
            </div>
        </div>
    </section>


    <script>
    const responses = {
        "intro": "안녕하세요!\n태평양애드(TAD)입니다. 😊\n진실된 마음으로 최고의 인테리어 솔루션을 제안합니다. 궁금하신 내용을 선택해주세요!",
        "pos": "📍 위치 안내\n저희 사무실은 경기도 광주시 경충대로 2191, B동에 위치하고 있습니다.\n(방문 전 연락 필수!)",
        "price": "💰 인테리어 시공 단가 안내\n업종과 매체에 따라 단가가 상이합니다.\n견적문의(CONTACT)에 성함과 연락처를 남겨주시면 제안서를 보내드립니다.",
        "time": "⏰ 영업 시간\n평일: 09:30 ~ 18:30\n주말 및 공휴일은 휴무입니다.",
        "default": "상세한 문의는 전화(010-3515-5678) 주시면 가장 빠르게 안내받으실 수 있습니다! 📞"
    };

    const win = document.getElementById("chatbot-window");
    const handle = document.getElementById("drag-handle");
    let isDragging = false, x = 0, y = 0;

    handle.onmousedown = (e) => {
        isDragging = true;
        x = e.clientX - win.offsetLeft;
        y = e.clientY - win.offsetTop;
        handle.style.cursor = 'grabbing';
    };

    document.onmousemove = (e) => {
        if (!isDragging) return;
        win.style.left = (e.clientX - x) + "px";
        win.style.top = (e.clientY - y) + "px";
        win.style.bottom = "auto"; 
        win.style.right = "auto";
    };

    document.onmouseup = () => {
        isDragging = false;
        handle.style.cursor = 'move';
    };

    function openChatbot() {
        win.style.display = 'flex'; 

        if (document.getElementById('chatbot-messages').children.length === 0) {
            initChat();
        }
    }

    function closeChatbot() { 
        win.style.display = 'none'; 
    }

    function initChat() {
        addMessage('bot', responses.intro);
        showButtons();
    }

    function showButtons() {
        const container = document.createElement('div');
        container.className = 'menu-container';
        
        const buttons = [
            { label: "🏢 회사 위치", key: "pos" },
            { label: "💵 시공 단가", key: "price" },
            { label: "🕙 상담 시간", key: "time" }
        ];

        buttons.forEach(btn => {
            const b = document.createElement('button');
            b.className = 'menu-btn';
            b.innerText = btn.label;
            b.onclick = () => {
                addMessage('user', btn.label);
                setTimeout(() => {
                    addMessage('bot', responses[btn.key]);
                }, 400);
            };
            container.appendChild(b);
        });
        document.getElementById('chatbot-messages').appendChild(container);
    }

      function addMessage(sender, text) {

        const box = document.getElementById('chatbot-messages');

        const msg = document.createElement('div');

        msg.className = `message ${sender}`;

        msg.innerText = text;

        box.appendChild(msg);

        box.scrollTop = box.scrollHeight; 

    }



    function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage('user', text);
        input.value = "";
        
        setTimeout(() => {
            addMessage('bot', responses.default);
        }, 600);
    }
    const messageBox = document.getElementById('chatbot-messages');

    messageBox.addEventListener('wheel', function(e) {
    const scrollTop = messageBox.scrollTop;
    const scrollHeight = messageBox.scrollHeight;
    const height = messageBox.clientHeight;
    const delta = e.deltaY;
    const isScrollingUp = delta < 0;

    if ((isScrollingUp && scrollTop <= 0) || (!isScrollingUp && scrollTop + height >= scrollHeight)) {
        e.preventDefault();
    }
    }, { passive: false });

    win.onwheel = function(e) {
    e.stopPropagation(); 
    };
    </script>

</body>
</html>
